name: Háttérfigyelő

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Teszt-értesítés küldése (1 = igen, 0 = nem)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Figyelő futtatása
        id: run
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST: ${{ github.event.inputs.test }}
        run: node watch.mjs
      - name: Kiegészítő modulok (osztrák állomás, AI-modellek)
        run: |
          for t in *.mjs.txt; do cp "$t" "${t%.txt}"; done
          for m in *-run.mjs; do [ -e "$m" ] || continue; node "$m" || echo "hiba: $m"; done
        continue-on-error: true
      - name: Eredmények mentése
        if: steps.run.outputs.commit == 'true'
        run: |
          git config user.name "solaris-watch"
          git config user.email "solaris-watch@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Háttérfigyelő: adatok frissítése" && git pull --rebase -X theirs && git push)
